<svg class="cta-bloom-filter" aria-hidden="true"> <defs> <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"> <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="glow-wide"></feGaussianBlur> <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="glow-tight"></feGaussianBlur> <feComposite in="SourceGraphic" in2="glow-wide" operator="arithmetic" k1="0" k2="1" k3="0.5" k4="0" result="with-wide"></feComposite> <feComposite in="with-wide" in2="glow-tight" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"></feComposite> </filter> </defs> </svg>
