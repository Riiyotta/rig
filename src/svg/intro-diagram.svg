<svg class="intro-diagram" viewBox="0 0 560 280" fill="none" xmlns="http://www.w3.org/2000/svg"> <defs> <!-- Active connector trail gradient --> <linearGradient id="trail-h1" x1="0" y1="0" x2="1" y2="0"> <stop offset="0%" stop-color="#22c55e" stop-opacity="0"></stop> <stop offset="70%" stop-color="#22c55e" stop-opacity="0.3"></stop> <stop offset="100%" stop-color="#22c55e" stop-opacity="0.6"></stop> </linearGradient> <linearGradient id="trail-h2" x1="0" y1="0" x2="1" y2="0"> <stop offset="0%" stop-color="#22c55e" stop-opacity="0"></stop> <stop offset="70%" stop-color="#22c55e" stop-opacity="0.3"></stop> <stop offset="100%" stop-color="#22c55e" stop-opacity="0.6"></stop> </linearGradient> <!-- Blocked trail (top-down) --> <linearGradient id="trail-block-down" x1="0" y1="0" x2="0" y2="1"> <stop offset="0%" stop-color="var(--red)" stop-opacity="0"></stop> <stop offset="60%" stop-color="var(--red)" stop-opacity="0.4"></stop> <stop offset="100%" stop-color="var(--red)" stop-opacity="0"></stop> </linearGradient> <!-- Paths for animateMotion --> <path id="path-code-rig" d="M130,125 L193,125"></path> <path id="path-rig-resp" d="M353,125 L423,125"></path> <path id="path-cloud-down" d="M273,37 L273,57"></path> <path id="path-rig-telem" d="M273,172 L273,192"></path> </defs> <!-- Machine boundary dashed box around the core flow --> <rect x="5" y="68" width="550" height="112" fill="none" stroke="rgba(240,237,230,0.08)" stroke-width="1" stroke-dasharray="4 4"></rect> <rect x="15" y="61" width="96" height="14" fill="var(--ink)"></rect> <text x="20" y="71" font-family="'Chivo Mono', monospace" font-size="6" letter-spacing="2" fill="rgba(240,237,230,0.3)">YOUR MACHINE</text> <!-- YOUR CODE input (left) --> <g class="svg-card"> <rect x="20" y="100" width="110" height="50" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.15)" stroke-width="1"></rect> <text x="75" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="7" letter-spacing="1.5" fill="rgba(240,237,230,0.4)" class="card-title">YOUR CODE</text> <text x="75" y="133" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="5.5" letter-spacing="1" fill="rgba(240,237,230,0.25)" class="card-sub">KEYSTROKES · FILES</text> </g> <!-- Connector: Code → RIG (active flow) --> <line x1="130" y1="125" x2="193" y2="125" stroke="rgba(34,197,94,0.15)" stroke-width="1" pointer-events="none"></line> <!-- Shooting star 1: Code → RIG --> <rect x="-1.5" y="-1.5" width="3" height="3" fill="#22c55e" pointer-events="none"> <animateMotion dur="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"> <mpath href="#path-code-rig"></mpath> </animateMotion> <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2s" repeatCount="indefinite"></animate> </rect> <!-- Trail line --> <line x1="130" y1="125" x2="193" y2="125" stroke="url(#trail-h1)" stroke-width="2" pointer-events="none"> <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"></animate> </line> <!-- RIG core (center, prominent) --> <g class="svg-card"> <rect x="193" y="78" width="160" height="94" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.2)" stroke-width="1.5"></rect> <text x="274.5" y="108" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="12" letter-spacing="3" fill="var(--paper)" class="card-title">RIG</text> <text x="273" y="124" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="5.5" letter-spacing="1.5" fill="#22c55e" class="card-accent">&#x2713; LOCAL INFERENCE</text> <!-- Sub-labels inside RIG --> <line x1="210" y1="145" x2="336" y2="145" stroke="rgba(240,237,230,0.08)" stroke-width="0.5" class="card-divider"></line> <text x="238" y="160" text-anchor="middle" font-family="'Chivo Mono', monospace" font-size="5" letter-spacing="1" fill="rgba(240,237,230,0.25)" class="card-sub">GPU</text> <text x="273" y="160" text-anchor="middle" font-family="'Chivo Mono', monospace" font-size="5" letter-spacing="1" fill="rgba(240,237,230,0.25)" class="card-sub">INDEX</text> <text x="308" y="160" text-anchor="middle" font-family="'Chivo Mono', monospace" font-size="5" letter-spacing="1" fill="rgba(240,237,230,0.25)" class="card-sub">MODEL</text> </g> <!-- Connector: RIG → Response (active flow) --> <line x1="353" y1="125" x2="423" y2="125" stroke="rgba(34,197,94,0.15)" stroke-width="1" pointer-events="none"></line> <!-- Shooting star 2: RIG → Response (delayed) --> <rect x="-1.5" y="-1.5" width="3" height="3" fill="#22c55e" pointer-events="none"> <animateMotion dur="2s" begin="1s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"> <mpath href="#path-rig-resp"></mpath> </animateMotion> <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2s" begin="1s" repeatCount="indefinite"></animate> </rect> <!-- Trail line --> <line x1="353" y1="125" x2="423" y2="125" stroke="url(#trail-h2)" stroke-width="2" pointer-events="none"> <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" begin="1s" repeatCount="indefinite"></animate> </line> <!-- RESPONSE output (right) --> <g class="svg-card"> <rect x="423" y="100" width="120" height="50" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.15)" stroke-width="1"></rect> <text x="483" y="121" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="7" letter-spacing="1.5" fill="rgba(240,237,230,0.4)" class="card-title">RESPONSE</text> <text x="483" y="133" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="5.5" letter-spacing="1" fill="#22c55e" class="card-accent">&lt;300ms · ON DEVICE</text> </g> <!-- CLOUD (top) — blocked --> <g class="svg-card"> <rect x="213" y="5" width="120" height="32" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.1)" stroke-width="1"></rect> <text x="273" y="21" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="7" letter-spacing="1.5" fill="rgba(240,237,230,0.4)" class="card-title">CLOUD</text> </g> <!-- Blocked line from cloud down --> <line x1="273" y1="37" x2="273" y2="78" stroke="var(--red)" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4" pointer-events="none"></line> <!-- Blocked shooting star: tries to enter, hits X, fades --> <rect x="-1.5" y="-1.5" width="3" height="3" fill="var(--red)" pointer-events="none"> <animateMotion dur="1.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"> <mpath href="#path-cloud-down"></mpath> </animateMotion> <animate attributeName="opacity" values="0.8;0.8;0" keyTimes="0;0.6;1" dur="1.5s" repeatCount="indefinite"></animate> </rect> <!-- X mark --> <g> <line x1="267" y1="51" x2="279" y2="63" stroke="var(--red)" stroke-width="1.5"></line> <line x1="279" y1="51" x2="267" y2="63" stroke="var(--red)" stroke-width="1.5"></line> </g> <!-- TELEMETRY (bottom) — blocked --> <g class="svg-card"> <rect x="213" y="215" width="120" height="32" fill="rgba(10,10,10,0.95)" stroke="rgba(240,237,230,0.1)" stroke-width="1"></rect> <text x="273" y="231" text-anchor="middle" dominant-baseline="central" font-family="'Chivo Mono', monospace" font-size="7" letter-spacing="1.5" fill="rgba(240,237,230,0.4)" class="card-title">TELEMETRY</text> </g> <!-- Blocked line from RIG down --> <line x1="273" y1="172" x2="273" y2="215" stroke="var(--red)" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4" pointer-events="none"></line> <!-- Blocked shooting star: tries to leave, hits X, fades --> <rect x="-1.5" y="-1.5" width="3" height="3" fill="var(--red)" pointer-events="none"> <animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"> <mpath href="#path-rig-telem"></mpath> </animateMotion> <animate attributeName="opacity" values="0.8;0.8;0" keyTimes="0;0.6;1" dur="1.5s" begin="0.75s" repeatCount="indefinite"></animate> </rect> <!-- X mark --> <g> <line x1="267" y1="187" x2="279" y2="199" stroke="var(--red)" stroke-width="1.5"></line> <line x1="279" y1="187" x2="267" y2="199" stroke="var(--red)" stroke-width="1.5"></line> </g> </svg>
